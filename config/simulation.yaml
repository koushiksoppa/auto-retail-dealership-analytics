inventory:
  opening_stock_max_age_days: 150   # opening vehicles were received up to this many days before start_date
  cost_to_price_ratio: 0.93         # dealer purchase cost as share of ex-showroom price
  allocation_prep_days: 2           # minimum days between receipt and delivery
  ageing_buckets: [30, 60, 90]      # upper bounds (inclusive): 0-30, 31-60, 61-90, >90
  aged_threshold_days: 60           # "aged inventory" = age in days strictly greater than this
  aged_discount_pct: [2.0, 6.0]     # extra discount range for vehicles older than aged_threshold_days

# Management action triggers. Thresholds are ILLUSTRATIVE business rules unless `basis`
# names a published source. Comparator: breach when actual <op> threshold.
action_rules:
  - kpi: aged_inventory_share_pct
    op: ">"
    threshold: 15.0
    responsible_role: Inventory Manager
    review_cadence: Weekly
    recommended_action: List aged VINs, set model-specific retail support, pause replenishment orders for affected models.
    basis: Illustrative business rule
  - kpi: days_of_supply
    op: ">"
    threshold: 21
    segments: [PV]                  # the FADA benchmark is stated for passenger vehicles only
    responsible_role: Dealer Principal
    review_cadence: Weekly
    recommended_action: Align OEM dispatch plan to retail run-rate; escalate excess allocation with the OEM zonal office.
    basis: "FADA recommends a 21-day PV inventory level (FADA Sep'26 release); applied here to simulated stock"
  - kpi: first_contact_sla_pct
    op: "<"
    threshold: 80.0
    responsible_role: CRM Manager
    review_cadence: Daily
    recommended_action: Re-route unassigned leads, enforce call-back queue, review salesperson lead load.
    basis: Illustrative business rule
  - kpi: test_drive_to_booking_pct
    op: "<"
    threshold: 30.0
    responsible_role: Sales Manager
    review_cadence: Weekly
    recommended_action: Review test-drive feedback and offer structure; coach salespeople below team median.
    basis: Illustrative business rule
  - kpi: lead_to_delivery_pct
    op: "<"
    threshold: 9.0
    responsible_role: General Manager - Sales
    review_cadence: Monthly
    recommended_action: Audit lead-source quality and spend; rebalance marketing budget toward converting sources.
    basis: Illustrative business rule
  - kpi: top_model_stock_share_pct
    op: ">"
    threshold: 45.0
    responsible_role: Dealer Principal
    review_cadence: Monthly
    recommended_action: Rebalance order mix; agree transfer of excess units with sister dealerships.
    basis: Illustrative business rule
  - kpi: awaiting_allocation_bookings
    op: ">"
    threshold: 15
    responsible_role: Sales Operations Manager
    review_cadence: Weekly
    recommended_action: Expedite allocation for oldest bookings; communicate revised delivery dates to customers.
    basis: Illustrative business rule
