# ASSUMPTIONS for python/dealership_kpi_simulation.py (Layer B: SIMULATED dealership data).
# Every value here is an illustrative modelling assumption. Nothing in this file or in the
# generated data describes the actual performance of any real dealership or brand.
#
# Change the seed, period or size here or on the command line:
#   python python/dealership_kpi_simulation.py --seed 7 --start 2026-02-01 --end 2026-09-30 --scale 0.5

seed: 20260930
start_date: "2026-02-01"
end_date: "2026-09-30"        # also the inventory snapshot date
scale: 1.0                     # multiplies every dealership's lead volume

lead_sources:                  # source: [share of leads, qualification probability]
  Walk-in: [0.30, 0.78]
  Website: [0.22, 0.52]
  Phone enquiry: [0.15, 0.60]
  Referral: [0.10, 0.80]
  Social media: [0.13, 0.38]
  Online marketplace: [0.10, 0.45]

first_contact:
  sla_hours: 4                 # illustrative internal follow-up standard
  qualify_penalty_if_late: 0.85

lost_reasons:
  lead: [Not reachable, Budget mismatch, Only researching, Duplicate enquiry]
  qualified: [No test drive slot accepted, Bought competitor brand, Purchase postponed, Finance not approved]
  test_drive: [Price / discount expectation, Bought competitor brand, Product fit concerns, Finance not approved, Purchase postponed]
  booking: [Booking cancelled - delivery wait, Booking cancelled - finance, Booking cancelled - changed mind]

